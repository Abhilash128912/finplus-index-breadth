<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Medical Pharmacy Style Rounded Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3" />

  <!-- Pharmacy Style Rounded Cross / Plus Symbol -->
  <!-- Horizontal Bar (Rounded) -->
  <rect x="42" y="82" width="116" height="36" rx="18" fill="url(#crossGrad)" filter="url(#glow)" />
  <!-- Vertical Bar (Rounded) -->
  <rect x="82" y="42" width="36" height="116" rx="18" fill="url(#crossGrad)" filter="url(#glow)" />

  <!-- Core Center Highlight Accent -->
  <circle cx="100" cy="100" r="10" fill="#FFFFFF" opacity="0.85" />
</svg>
